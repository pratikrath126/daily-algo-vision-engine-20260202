<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoVision Engine</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="brand">
            <h1>AlgoVision Engine</h1>
            <span class="badge">v1.0.0</span>
        </div>
        <nav>
            <button id="visualizeBtn" class="btn-primary">Visualize Algorithm</button>
            <button id="clearBtn" class="btn-secondary">Clear Board</button>
        </nav>
    </header>

    <div class="legend">
        <div class="legend-item"><div class="node-icon start"></div>Start Node</div>
        <div class="legend-item"><div class="node-icon end"></div>Target Node</div>
        <div class="legend-item"><div class="node-icon wall"></div>Wall</div>
        <div class="legend-item"><div class="node-icon visited"></div>Visited</div>
        <div class="legend-item"><div class="node-icon path"></div>Shortest Path</div>
    </div>

    <div class="main-container">
        <div id="grid-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
